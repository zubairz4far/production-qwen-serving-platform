[project]
name = "production-qwen-serving-platform"
version = "0.3.0"
description = "Production-style serving platform for Qwen3 and LoRA adapters on vLLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "prometheus-client==0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]
rag = [
  "pypdf==6.14.2",
  "qdrant-client==1.18.0",
  "sentence-transformers==5.6.1",
]

[tool.setuptools.packages.find]
include = ["gateway*", "rag_platform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/policy_hardening_experiment.py" = ["E501", "I001"]
